name: Collate links

on:
  schedule:
    - cron: '0 16 * * *' # 00:00 Asia/Singapore (UTC+08:00)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collate-news
  cancel-in-progress: false

jobs:
  scrape-to-local:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run Orchestration Script
        run: npm start

      - name: Upload scrape metadata artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-metadata
          path: |
            data/scrape_metadata/drift_report.md
            data/scrape_metadata/run_summary.json
          if-no-files-found: ignore

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/routes.json
          if [ -f data/scrape_metadata/feed_items.json ]; then
            git add data/scrape_metadata/feed_items.json
          fi
          if [ -f data/scrape_metadata/fingerprints.json ]; then
            git add data/scrape_metadata/fingerprints.json
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit; skipping."
            exit 0
          fi
          git commit -m "Updated routes.json"
          git push
